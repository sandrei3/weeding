<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Andrei & Bianca Wedding</title>

<link rel="stylesheet" href="styles.css"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

<section class="hero">
  <div class="glow"></div>

  <h1>Andrei <span>&</span> Bianca</h1>
  <p>26 Septembrie 2026</p>

  <div class="countdown">
    <div><span id="d"></span><small>Days</small></div>
    <div><span id="h"></span><small>Hours</small></div>
    <div><span id="m"></span><small>Min</small></div>
    <div><span id="s"></span><small>Sec</small></div>
  </div>

  <button onclick="saveDate()">Save the Date</button>
</section>

<section class="card">
  <h2>Cununia religioasă</h2>
  <p>16:00 - Biserica Înălțarea Domnului, Galați</p>
  <iframe src="https://www.google.com/maps?q=Biserica%20Inaltarea%20Domnului%20Galati&output=embed"></iframe>
</section>

<section class="card">
  <h2>Petrecerea</h2>
  <p>19:30 - Union Jack Event, Galați</p>
  <iframe src="https://www.google.com/maps?q=Union%20Jack%20Event%20Galati&output=embed"></iframe>
</section>

<section class="card">
  <h2>RSVP</h2>

  <input id="name" placeholder="Nume"/>
  <input id="people" type="number" placeholder="Persoane"/>
  <button onclick="rsvp()">Confirm</button>

  <div id="list"></div>
</section>

<script src="app.js"></script>
</body>
</html>
